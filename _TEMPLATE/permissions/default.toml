"$schema" = "schemas/schema.json"

# Default permission set enabled when the plugin is added to a Tauri app
# WITHOUT explicit capability configuration.
#
# Each entry references either:
#   - a permission identifier auto-generated by `tauri-plugin`'s build script
#     under `permissions/autogenerated/commands/<cmd>.toml`
#     (identifiers: `allow-<cmd>` and `deny-<cmd>`)
#   - or a hand-crafted permission set defined in another TOML file in this
#     folder (e.g. `scope.toml`).
#
# Add NEW commands to this array ONLY if you want them callable by default.
# Anything you do NOT add here requires the user to opt-in via capabilities.
[default]
description = "Default permissions for the tauri-plugin-template plugin."
permissions = ["allow-ping"]
