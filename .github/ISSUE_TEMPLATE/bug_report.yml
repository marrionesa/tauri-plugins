name: Bug report
description: Something does not work as documented
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before opening an issue, please check:
          - the README of the plugin you are using
          - that the permission for the command is enabled in your capability file
          - that you are on the latest published version of both halves

  - type: input
    id: plugin
    attributes:
      label: Affected plugin
      description: Which plugin is this about?
      placeholder: tauri-plugin-uuid
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version of both the crate and the npm package you installed.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: tauri-version
    attributes:
      label: Tauri version
      placeholder: 2.x
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Relevant code
      description: The Rust registration and the JavaScript call.
      render: rust
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the full error. If it mentions a permission identifier, keep it in.
      render: shell
    validations:
      required: false
