# Keeps dependencies and GitHub Actions up to date.
#
# Grouped so that a routine bump is a single pull request per ecosystem instead
# of one PR per dependency. The plugin crates intentionally pin `tauri = "2"`,
# so patch and minor updates of the Tauri stack arrive together.
version: 2
updates:
  # Rust: one entry per plugin, because each one is its own crate.
  - package-ecosystem: cargo
    directory: /tauri-plugin-beep
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /tauri-plugin-hash
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /tauri-plugin-hostname
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /tauri-plugin-mimetype
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /tauri-plugin-timezone
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /tauri-plugin-uuid
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  # The plugin directories are also npm packages.
  - package-ecosystem: npm
    directories:
      - /tauri-plugin-beep
      - /tauri-plugin-hash
      - /tauri-plugin-hostname
      - /tauri-plugin-mimetype
      - /tauri-plugin-timezone
      - /tauri-plugin-uuid
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
