"$schema" = "schemas/schema.json"

# Default permission set enabled when the plugin is added to a Tauri app
# WITHOUT explicit capability configuration. Both commands are safe to enable
# by default: they take no user input, perform no I/O, and have no side effects.
[default]
description = "Allow reading the system IANA timezone and the current UTC offset. Both commands are read-only, perform no I/O, and have no side effects — safe to enable by default."
permissions = ["allow-get-timezone", "allow-get-utc-offset-seconds"]
